<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1e24" />
    <meta name="description" content="Turn your phone into a stun gun. Hold the trigger to fire." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Electrifyer</title>
  </head>
  <body>
    <main class="stage">
      <div class="stungun">
        <div class="prongs" aria-hidden="true">
          <span class="prong prong--left"></span>
          <span class="prong prong--right"></span>
          <canvas class="arc"></canvas>
        </div>

        <div class="shell">
          <div class="plate" aria-hidden="true">
            <span class="boss boss--left"></span>
            <span class="boss boss--right"></span>
          </div>

          <span class="led" aria-hidden="true"></span>
          <h1 class="brand" translate="no">Electrifyer</h1>

          <div class="trigger-well">
            <button class="trigger" type="button" aria-label="Hold to fire">
              <svg class="trigger__bolt" viewBox="0 0 24 40" aria-hidden="true">
                <path d="M15 0 L2 23 H11 L8 40 L22 15 H13 Z" />
              </svg>
            </button>
          </div>

          <div class="grip" aria-hidden="true"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
